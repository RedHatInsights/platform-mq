apiVersion: v1
kind: Template
metadata:
  name: mq-resources
parameters:
- name: KAFKA_VOL_SIZE
  description: Size of volumes for Kafka brokers
  value: 250Gi
- name: ZK_VOL_SIZE
  description: Size of volumes for Zookeeper nodes
  value: 50Gi
- name: KAFKA_CPU_REQUESTS
  value: 250m
- name: KAFKA_CPU_LIMITS
  value: '1'
- name: KAFKA_MEMORY_REQUESTS
  value: 4Gi
- name: KAFKA_MEMORY_LIMITS
  value: 5Gi
- name: KAFKA_NUM_REPLICAS
  value: '3'
- name: KAFKA_HEAP_OPTS_XMS
  value: 4g
- name: KAFKA_HEAP_OPTS_XMX
  value: 4g
- name: ZOOKEEPER_CPU_REQUESTS
  value: 250m
- name: ZOOKEEPER_CPU_LIMITS
  value: '1'
- name: ZOOKEEPER_MEMORY_REQUESTS
  value: 4Gi
- name: ZOOKEEPER_MEMORY_LIMITS
  value: 5Gi
- name: ZOOKEEPER_NUM_REPLICAS
  value: '3'

objects:
- apiVersion: kafka.strimzi.io/v1beta1
  kind: Kafka
  metadata:
    name: platform-mq
    labels:
      app: platform-mq
  spec:
    entityOperator:
      tlsSidecar:
        resources:
          limits:
            cpu: 100m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      topicOperator:
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
      userOperator:
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
    kafka:
      version: 2.4.0
      config:
        log.message.format.version: '2.4'
        auto.create.topics.enable: false
        log.retention.hours: 72
        offsets.topic.replication.factor: 3
        transaction.state.log.min.isr: 2
        transaction.state.log.replication.factor: 3
      jvmOptions:
        -Xms: ${KAFKA_HEAP_OPTS_XMS}
        -Xmx: ${KAFKA_HEAP_OPTS_XMX}
      listeners:
        plain: {}
        tls: {}
      livenessProbe:
        initialDelaySeconds: 15
        timeoutSeconds: 5
      metrics:
        lowercaseOutputName: true
      readinessProbe:
        initialDelaySeconds: 15
        timeoutSeconds: 5
      replicas: ${{KAFKA_NUM_REPLICAS}}
      resources:
        limits:
          cpu: ${KAFKA_CPU_LIMITS}
          memory: ${KAFKA_MEMORY_LIMITS}
        requests:
          cpu: ${KAFKA_CPU_REQUESTS}
          memory: ${KAFKA_MEMORY_REQUESTS}
      tlsSidecar:
        resources:
          limits:
            cpu: 100m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      storage:
        deleteClaim: false
        size: ${KAFKA_VOL_SIZE}
        type: persistent-claim
    zookeeper:
      livenessProbe:
        initialDelaySeconds: 15
        timeoutSeconds: 5
      metrics:
        lowercaseOutputName: true
      readinessProbe:
        initialDelaySeconds: 15
        timeoutSeconds: 5
      replicas: ${{ZOOKEEPER_NUM_REPLICAS}}
      resources:
        limits:
          cpu: ${ZOOKEEPER_CPU_LIMITS}
          memory: ${ZOOKEEPER_MEMORY_LIMITS}
        requests:
          cpu: ${ZOOKEEPER_CPU_REQUESTS}
          memory: ${ZOOKEEPER_MEMORY_REQUESTS}
      storage:
        deleteClaim: false
        size: ${ZK_VOL_SIZE}
        type: persistent-claim
