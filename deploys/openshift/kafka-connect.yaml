apiVersion: v1
kind: Template
metadata:
  name: kafka-connect
parameters:
- name: KAFKA_CONNECT_IMAGE
  value: quay.io/cloudservices/kafka-connect
- name: BOOTSTRAP_SERVERS
  value: platform-mq-kafka-bootstrap.platform-mq.svc.cluster.local:9093
objects:
- apiVersion: kafka.strimzi.io/v1beta1
  kind: KafkaConnect
  metadata:
    name: platform-kafka-connect
    labels:
      app: platform-mq
    annotations:
      strimzi.io/use-connector-resources: "true"
  spec:
    image: ${KAFKA_CONNECT_IMAGE}
    version: 2.4.0
    replicas: 1
    bootstrapServers: ${BOOTSTRAP_SERVERS}
    tls:
      trustedCertificates:
        - secretName: platform-mq-cluster-ca-cert
          certificate: ca.crt
    config:
      group.id: connect-cluster
      offset.storage.topic: connect-cluster-offsets
      config.storage.topic: connect-cluster-configs
      status.storage.topic: connect-cluster-status
