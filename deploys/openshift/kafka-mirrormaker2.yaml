apiVersion: v1
kind: Template
metadata:
  name: platform-kafka-mm2
parameters:
- name: MM2_CLUSTER_NAME
  value: platform-kafka-mm2
- name: MM2_REPLICA_COUNT
  value: "1"
- name: SRC_CLUSTER_ALIAS
  value: "source-kafka-cluster"
- name: SRC_CLUSTER_BOOTSTRAP
  required: true
- name: TGT_CLUSTER_ALIAS
  value: "target-kafka-cluster"
- name: TGT_CLUSTER_BOOTSTRAP
  required: true
- name: REPLICATION_FACTOR
  value: "3"
objects:
- apiVersion: kafka.strimzi.io/v1beta2
  kind: KafkaMirrorMaker2
  metadata:
    name: ${MM2_CLUSTER_NAME}
  spec:
    clusters:
    - alias: ${SRC_CLUSTER_ALIAS}
      bootstrapServers: ${SRC_CLUSTER_BOOTSTRAP}
    - alias: ${TGT_CLUSTER_ALIAS}
      bootstrapServers: ${TGT_CLUSTER_BOOTSTRAP}
    config:
      config.storage.replication.factor: -1
      offset.storage.replication.factor: -1
      status.storage.replication.factor: -1
    connectCluster: ${SRC_CLUSTER_ALIAS}
    mirrors:
      - checkpointConnector:
          config:
            checkpoints.topic.replication.factor: ${{REPLICATION_FACTOR}}
        groupsPattern: .*
        heartbeatConnector:
          config:
            heartbeats.topic.replication.factor: ${{REPLICATION_FACTOR}}
        sourceCluster: ${SRC_CLUSTER_ALIAS}
        sourceConnector:
          config:
            offset-syncs.topic.replication.factor: ${{REPLICATION_FACTOR}}
            replication.factor: ${{REPLICATION_FACTOR}}
            sync.topic.acls.enabled: 'false'
        targetCluster: ${TGT_CLUSTER_ALIAS}
        topicsPattern: .*
    replicas: ${{MM2_REPLICA_COUNT}}
    version: 2.8.0