apiVersion: v1
kind: Template
metadata:
  name: lightbend-lag-exporter
parameters:
- name: APPSRE_ENV
  value: stage
- name: REPLICAS
  value: "1"

objects:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app: lightbend-lag-exporter
    name: lightbend-lag-exporter
  spec:
    minReadySeconds: 15
    progressDeadlineSeconds: 600
    replicas: ${{REPLICAS}}
    revisionHistoryLimit: 9
    selector:
      matchLabels:
        app: lightbend-lag-exporter
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      type: RollingUpdate
    template:
      metadata:
        labels:
          app: lightbend-lag-exporter
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - lightbend-lag-exporter
                topologyKey: failure-domain.beta.kubernetes.io/zone
              weight: 100
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - lightbend-lag-exporter
                topologyKey: kubernetes.io/hostname
              weight: 99
        containers:
        - image: quay.io/app-sre/lightbend-lag-exporter:0.6.2
          imagePullPolicy: IfNotPresent
          name: lightbend-lag-exporter
          ports:
          - containerPort: 8000
            name: port-8000
            protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 1000Mi
            requests:
              cpu: 250m
              memory: 250Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /opt/docker/conf/
            name: volume-c86u8
        dnsPolicy: ClusterFirst
        imagePullSecrets:
        - name: quay-cloudservices-pull
        - name: rh-registry-pull
        - name: quay.io
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
        volumes:
        - configMap:
            defaultMode: 420
            name: lightbend-exporter-config
          name: volume-c86u8

- apiVersion: v1
  data:
    application.conf: |-
      kafka-lag-exporter {
        reporters.prometheus.port = 8000
        poll-interval = 30 seconds
        lookup-table-size = 60
        client-group-id = "lightbendlagexporter-${APPSRE_ENV}"
        kafka-client-timeout = 10 seconds
        clusters = [
          {
            name = "platform-mq"
            bootstrap-brokers = "platform-mq-kafka-bootstrap.platform-mq-${APPSRE_ENV}.svc.cluster.local:9092"
            topic-whitelist = [".*"]
          }
        ]
        watchers = {
          strimzi = "false"
        }
        metric-whitelist = [".*"]
      }
  kind: ConfigMap
  metadata:
    name: lightbend-exporter-config
    annotations:
      qontract.recycle: "true"

- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app: lightbend-lag-exporter
      strimzi.io/discovery: "true"
      strimzi.io/cluster: platform-mq
    name: lightbend-lag-exporter
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "9404" 
      prometheus.io/scrape: "true"  
  spec:
    ports:
      - name: port-8000
        port: 8000
        protocol: TCP
        targetPort: 8000
    selector:
      app: lightbend-lag-exporter
    sessionAffinity: None
    type: ClusterIP
