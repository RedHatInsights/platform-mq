apiVersion: v1
kind: Template
metadata:
  name: kafka-connect
parameters:
- name: KAFKA_CONNECT_IMAGE
  description: Image for kafka connect instance
  value: quay.io/cloudservices/kafka-connect
- name: IMAGE_TAG
  description: Tag to use for this deploy of kafka connect
  value: latest
- name: KAFKA_CONNECT_VERSION
  description: Version of the kafka-connect service
  value: 2.7.0
- name: KAFKA_CONNECT_REPLICAS
  description: Number of connect instances to run
  value: "1"
- name: BOOTSTRAP_SERVERS
  required: true
- name: AUTH_CLIENT_ID
  value: "username"
- name: AUTH_SECRET_NAME
  value: "kafka"
- name: AUTH_SECRET_KEY
  value: "client_secret"
objects:
- apiVersion: kafka.strimzi.io/v1beta2
  kind: KafkaConnect
  metadata:
    name: platform-kafka-connect
    labels:
      app: platform-mq
    annotations:
      strimzi.io/use-connector-resources: "true"
  spec:
    image: ${KAFKA_CONNECT_IMAGE}:${IMAGE_TAG}
    version: ${KAFKA_CONNECT_VERSION}
    replicas: ${{KAFKA_CONNECT_REPLICAS}}
    resources:
      limits:
        cpu: "1"
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    bootstrapServers: ${BOOTSTRAP_SERVERS}
    tls:
      trustedCertificates: []
    authentication:
      type: scram-sha-512
      username: ${AUTH_CLIENT_ID}
      passwordSecret:
        secretName: ${AUTH_CLIENT_SECRET_NAME}
        key: ${AUTH_CLIENT_SECRET_KEY}
    externalConfiguration:
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: strimzi-bucket-read-write
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: strimzi-bucket-read-write
              key: aws_secret_access_key
    config:
      group.id: connect-cluster
      offset.storage.topic: connect-cluster-offsets
      config.storage.topic: connect-cluster-configs
      status.storage.topic: connect-cluster-status
