apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    app: platform-mq-<env>
  name: kafka-lag-exporter-<env>
  namespace: platform-mq-<env>
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    deploymentconfig: kafka-lag-exporter-<env>
  strategy:
    activeDeadlineSeconds: 21600
    resources: {}
    rollingParams:
      intervalSeconds: 1
      maxSurge: 25%
      maxUnavailable: 25%
      timeoutSeconds: 600
      updatePeriodSeconds: 1
    type: Rolling
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: platform-mq-<env>
        deploymentconfig: kafka-lag-exporter-<env>
    spec:
      containers:
      - env:
        - name: CONSUMER_CONFIG
          value: /data/consumer_config.ini
        - name: APP_FILE
          value: prometheus_kafka_consumer_group_exporter/__main__.py
        image: 172.30.217.42:5000/platform-mq-prod/kafka-lag-exporter@sha256:2434b6ec86c978ab364badc4ac10c282d55f7d2d2450980dae7b3439e6446238
        imagePullPolicy: Always
        name: kafka-lag-exporter-<env>
        ports:
        - containerPort: 9208
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: volume-etypo
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: consumerconfig
        name: volume-etypo
  test: false
  triggers:
  - imageChangeParams:
      automatic: true
      containerNames:
      - kafka-lag-exporter-prod
      from:
        kind: ImageStreamTag
        name: kafka-lag-exporter:latest
        namespace: platform-mq-prod
      lastTriggeredImage: 172.30.217.42:5000/platform-mq-prod/kafka-lag-exporter@sha256:2434b6ec86c978ab364badc4ac10c282d55f7d2d2450980dae7b3439e6446238
    type: ImageChange
  - type: ConfigChange
    message: config change
  latestVersion: 1
  observedGeneration: 3
  readyReplicas: 1
  replicas: 1
  unavailableReplicas: 0
  updatedReplicas: 1
