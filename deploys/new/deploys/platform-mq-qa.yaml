apiVersion: kafka.strimzi.io/v1alpha1
kind: Kafka
metadata:
  name: platform-mq-qa
  namespace: platform-mq-qa
spec:
  entityOperator:
    topicOperator: {}
    userOperator:
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 300m
          memory: 512Mi
  kafka:
    config:
      auto.create.topics.enable: false
      offsets.topic.replication.factor: 3
      transaction.state.log.min.isr: 2
      transaction.state.log.replication.factor: 3
    jvmOptions:
      -Xms: 4g
      -Xmx: 4g
    listeners:
      plain: {}
      tls: {}
    livenessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
    metrics:
      lowercaseOutputName: true
      rules:
      - name: kafka_server_$1_$2_total
        pattern: kafka.server<type=(.+), name=(.+)PerSec\w*><>Count
      - labels:
          topic: $3
        name: kafka_server_$1_$2_total
        pattern: kafka.server<type=(.+), name=(.+)PerSec\w*, topic=(.+)><>Count
    readinessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
    replicas: 3
    resources:
      limits:
        cpu: "1"
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 4Gi
    storage:
      deleteClaim: false
      size: 1Gi
      type: persistent-claim
  zookeeper:
    livenessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
    metrics:
      lowercaseOutputName: true
    readinessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
    replicas: 3
    resources:
      limits:
        cpu: "1"
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 4Gi
    storage:
      deleteClaim: false
      size: 1Gi
      type: persistent-claim
