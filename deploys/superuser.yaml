apiVersion: v1
kind: Template
metadata:
  name: superuser
parameters: []
objects:
- apiVersion: kafka.strimzi.io/v1beta2
  kind: KafkaUser
  metadata:
    labels:
      strimzi.io/cluster: platform-mq
    name: superuser
  spec:
    authentication:
      type: scram-sha-512
    authorization:
      acls:
      - host: '*'
        operation: All
        resource:
          name: '*'
          patternType: literal
          type: topic
      - host: '*'
        operation: All
        resource:
          name: '*'
          patternType: literal
          type: group
      type: simple
