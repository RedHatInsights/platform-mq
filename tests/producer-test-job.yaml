apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: producer-test-job
  name: producer-test-job
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: kafka-test-producer
    spec:
      containers:
      - name: kafka-test-producer
        image: scholzj/kafka-producer:latest
        env:
          - name: BOOTSTRAP_SERVERS
            value: platform-mq-kafka:9092
          - name: TOPIC
            value: test-job
          - name: TIMER
            value: "100"
          - name: NUMBER_OF_KEYS
            value: "1"
          - name: MESSAGE_COUNT
            value: "1000"
      restartPolicy: OnFailure
