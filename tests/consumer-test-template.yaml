apiVersion: v1
kind: Template
metadata:
  name: consumer-test-template
parameters:
- name: count
  description: How many messages to consume before stopping the test
  value: "1000"
- name: topic
  description: Topic from which to consume the test messages
  value: test-topic
- name: servers
  description: Kafka brokers to connect to
  required: true
- name: group
  description: Consumer group to join
  value: test-consumer-group
objects:
- apiVersion: batch/v1
  kind: Job
  metadata:
    labels:
      app: consumer-test-job
    name: consumer-test-job
  spec:
    parallelism: 1
    completions: 1
    backoffLimit: 5
    template:
      metadata:
        labels:
          app: kafka-test-consumer
      spec:
        containers:
        - name: kafka-test-consumer
          image: scholzj/kafka-consumer:latest
          env:
            - name: BOOTSTRAP_SERVERS
              value: ${servers}
            - name: TOPIC
              value: ${topic}
            - name: GROUP_ID
              value: ${group}
            - name: MESSAGE_COUNT
              value: ${count}
        restartPolicy: OnFailure
