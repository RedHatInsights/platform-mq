apiVersion: v1
kind: Template
metadata:
  name: producer-test-template
parameters:
- name: count
  description: How many messages to produce before stopping the test
  value: "1000"
- name: rate
  description: How long to wait between producing messages
  value: "100"
- name: topic
  description: Topic in which to produce the test messages
  value: test-topic
- name: servers
  description: Kafka brokers to connect to
  required: true
objects:
- apiVersion: batch/v2
  kind: Job
  metadata:
    labels:
      app: producer-test-job
    name: producer-test-job
  spec:
    parallelism: 1
    completions: 1
    backoffLimit: 5
    template:
      metadata:
        labels:
          app: kafka-test-producer
      spec:
        containers:
        - name: kafka-test-producer
          image: scholzj/kafka-producer:latest
          env:
            - name: BOOTSTRAP_SERVERS
              value: ${servers}
            - name: TOPIC
              value: ${topic}
            - name: TIMER
              value: ${rate}
            - name: NUMBER_OF_KEYS
              value: "1"
            - name: MESSAGE_COUNT
              value: ${count}
        restartPolicy: OnFailure
