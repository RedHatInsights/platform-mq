name: generate-topic-configs
run-name: Generating topic configs for ${{github.ref_name}}
on:
  push:
    branches:
      - master
    paths:
      - 'helm/kafka-topics/values.yaml'
jobs:
  run-helm-topic-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check helm template
        run: helm lint ./helm/kafka-topics/
      - name: Generate kafka-topics.yaml
        run: helm template ./helm/kafka-topics -f ./helm/kafka-topics/values.yaml > ./deploys/openshift/kafka-topics.yaml
      - name: Add PR for generated yaml
        uses: peter-evans/create-pull-request@v4