apiVersion: kafka.strimzi.io/v1alpha1
kind: KafkaConnectS2I
metadata:
  name: platform-ci-connect-cluster
spec:
  replicas: 1
  readinessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 5
  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 5
  bootstrapServers: platform-mq-ci-kafka-bootstrap:9093
  metrics:
    lowercaseOutputName: true
  tls:
    trustedCertificates:
      - secretName: platform-mq-ci-cluster-ca-cert
        certificate: ca.crt
